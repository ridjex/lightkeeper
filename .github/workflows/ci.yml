name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install ruff && ruff check .
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[ui]"
      - run: python -m unittest discover -s tests
  core-only:
    # The suite without Rich and Textual: the loop must work where the screen is not installed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests
  install:
    # What a stranger gets: a wheel installed in a clean environment, run from another directory.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install build && python -m build
      - run: python -m venv /tmp/venv && /tmp/venv/bin/pip install "$(ls dist/*.whl)[ui]"
      - run: cd /tmp && /tmp/venv/bin/lightkeeper --version && /tmp/venv/bin/lightkeeper --init --config-dir /tmp/lk && /tmp/venv/bin/lightkeeper --status --config-dir /tmp/lk --state-dir /tmp/lk-state
