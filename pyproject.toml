[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "lightkeeper"
description = "Reviews GitHub pull requests in your name, by rules you write in plain language, with your own gh and claude logins."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
ui = ["rich>=14.2", "textual>=8.2.7"]

[project.scripts]
lightkeeper = "lightkeeper.__main__:main"

[project.urls]
Repository = "https://github.com/ridjex/lightkeeper"

[tool.setuptools.packages.find]
include = ["lightkeeper*"]

[tool.setuptools.package-data]
lightkeeper = ["templates/*"]

[tool.setuptools.dynamic]
version = {attr = "lightkeeper.__version__"}

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # Optional-dependency guards precede the imports they protect.
